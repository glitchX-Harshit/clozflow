[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pearl-evaluation-lab"
version = "1.0.0"
description = "Production-grade standalone AI evaluation and benchmarking framework for Pearl AI"
authors = [{ name = "Clozflow AI Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.4.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "tabulate>=0.9.0",
    "rich>=13.5.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "jinja2>=3.1.2",
    "numpy>=1.24.0",
]

[project.scripts]
pearl-eval = "pearl_eval.cli:main"

[tool.setuptools.packages.find]
include = ["pearl_eval*", "adapters*", "datasets*", "evaluators*", "metrics*", "simulators*", "runners*", "benchmarks*", "reports*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
