id: rag_control_fix_v2

PROJECT: Hexagon CloserBrain Stabilization

GOAL:
  Restore system control over RAG
  Prevent generic responses, repetition, and over-questioning

---

CORE_CHANGES:

  - Remove RAG strategy override
  - Add decision priority system (System > RAG)
  - Limit RAG influence to hints only
  - Add anti-repetition enforcement
  - Reduce question spam
  - Remove context over-injection
  - Add control/push behavior

---

STEP_1_REMOVE_RAG_OVERRIDE:

  file: sales_ai_engine.py

  DELETE:

    forced_strategy = rag_results[0]["strategy"]

  REASON:
    RAG must not dictate behavior

---

STEP_2_DECISION_PRIORITY:

  ADD BEFORE LLM CALL:

    intent = detected_intent
    rag_strategy = rag_results[0]["strategy"] if rag_results else None

    if intent == "pricing":
        final_strategy = "ROI_REFRAME"
    elif intent == "authority":
        final_strategy = "DECISION_CONTROL"
    elif intent == "trust":
        final_strategy = "SOCIAL_PROOF"
    else:
        final_strategy = rag_strategy or "DIAGNOSTIC_QUESTION"

---

STEP_3_LIMIT_RAG_POWER:

  MODIFY system prompt:

    ADD:

      RAG INSIGHTS ARE ONLY HINTS.
      DO NOT follow them blindly.
      DO NOT repeat patterns from them.
      Use your own reasoning first.

---

STEP_4_ANTI_REPETITION_STRATEGY:

  ADD:

    if self.last_strategies and final_strategy == self.last_strategies[-1]:
        final_strategy = "DIAGNOSTIC_QUESTION"

---

STEP_5_RESPONSE_VARIATION_RULE:

  MODIFY system prompt:

    ADD:

      RESPONSE BEHAVIOR:
      - Do NOT ask a question every time
      - Mix:
        - reframing
        - statements
        - challenges
      - Only ask question when needed

---

STEP_6_REMOVE_CONTEXT_SPAM:

  MODIFY system prompt:

    CHANGE:

      "Always reference user's business"

    TO:

      "Reference user context ONLY when relevant, not in every response"

---

STEP_7_ADD_CONTROL_BEHAVIOR:

  MODIFY system prompt:

    ADD:

      CONTROL RULE:
      - At least once every 2–3 turns:
        - challenge the prospect OR
        - reframe their thinking OR
        - push toward decision

---

STEP_8_LIMIT_RAG_OUTPUT:

  MODIFY rag_context:

    CHANGE FORMAT TO:

      - Insight: ...
      - Avoid: ...

    REMOVE:
      direct "Strategy:" injection

---

STEP_9_ADD STRATEGY VARIATION:

  ADD:

    available_strategies = [
      "ROI_REFRAME",
      "COST_OF_INACTION",
      "SOCIAL_PROOF",
      "DIAGNOSTIC_QUESTION",
      "FUTURE_PACING",
      "DECISION_CONTROL"
    ]

---

STEP_10_TONE_AWARE_RESPONSE (LIGHT VERSION):

  ADD TO PROMPT:

    TONE AWARENESS:
    - If prospect sounds skeptical → use proof-based tone
    - If dismissive → be confident and direct
    - If curious → be clear and structured

---

STEP_11_OUTPUT LIMITATION:

  MODIFY:

    response:
      - max 2 sentences
      - no generic phrases like:
        "our product helps..."
        "this solution can increase..."

---

STEP_12_TESTING:

  TEST CASES:

    - pricing objection
    - hesitation + pricing combo
    - authority delay
    - dismissive tone

  VERIFY:

    - no repeated strategy spam
    - no repeated question pattern
    - less generic wording
    - more control in conversation

---

SUCCESS_CRITERIA:

  BEFORE:
    - repetitive
    - passive
    - generic
    - RAG dominated

  AFTER:
    - controlled
    - varied
    - sharp responses
    - system-driven decisions

---

WARNING:

  DO NOT:
    - increase RAG entries
    - increase retrieval count
    - re-add strategy override

  DO:
    - keep system in control
    - treat RAG as assistant, not brain