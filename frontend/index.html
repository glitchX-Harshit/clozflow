<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.istockphoto.com/id/1414609582/vector/letter-b-3d-logo-letters-b-t-in-a-3d-cube-numbers-6-and-9-in-isometric-box.jpg?s=612x612&w=0&k=20&c=vzFjEpbLU7vBezDn1XJgGLOEwEIUc_vJLE5hSa9UASI=" />
    
    <!-- Lighthouse SEO & Accessibility compliant Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Meta Robot Directives -->
    <meta name="robots" content="index, follow" />
    
    <!-- Canonical URL (Google SEO Priority) -->
    <link rel="canonical" href="https://clozflow.ai" />

    <!-- Standard Primary SEO Metas -->
    <title>ClozFlow.ai — Autonomous AI Sales Assistant & B2B Outreach Bot</title>
    <meta name="description" content="ClozFlow.ai is an intelligent B2B sales automation platform. Deploy autonomous AI sales agents to find local leads, manage WhatsApp & cold email outreach campaigns, handle objections, and sync with your CRM automatically." />
    <meta name="keywords" content="AI sales assistant, B2B sales automation, autonomous outreach bot, WhatsApp sales automation, lead finder, ClozFlow Pearl, cold email outreach AI, cognitive sales agent, automatic CRM sync, sales objection handler" />

    <!-- Open Graph / Facebook Metas (GEO/AEO index support) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clozflow.ai" />
    <meta property="og:title" content="ClozFlow.ai — Autonomous AI Sales Assistant & B2B Outreach Bot" />
    <meta property="og:description" content="Scale B2B lead generation and customer outreach using autonomous AI sales employees. Real-time CRM syncing and smart WhatsApp integrations." />
    <meta property="og:image" content="https://clozflow.ai/assets/og-image.jpg" />

    <!-- Twitter Card Metas -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://clozflow.ai" />
    <meta name="twitter:title" content="ClozFlow.ai — Autonomous AI B2B Sales Employee" />
    <meta name="twitter:description" content="Generate leads, run personalized outreach campaigns, and handle sales calls on autopilot with ClozFlow." />

    <!-- Preconnect Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet" />
