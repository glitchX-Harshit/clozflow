[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clozflow-enterprise-brain"
version = "0.1.0"
description = "ClozFlow Enterprise Brain foundation aligned to the CCBS architecture."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "asyncpg>=0.29",
  "aiokafka>=0.10",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "PyYAML>=6.0",
  "celery>=5.4",
  "python-dotenv>=1.0",
  "qdrant-client>=1.15",
  "PyJWT[crypto]>=2.10",
  "cryptography>=43",
  "psutil>=6",
]

[project.optional-dependencies]
main-app = ["google-genai>=1", "openai>=1.50", "reportlab>=4.4", "python-multipart>=0.0.20",
            "passlib>=1.7", "bcrypt>=4", "beautifulsoup4>=4", "python-docx>=1.2",
            "phonenumbers>=9", "pypdf>=6", "openpyxl>=3.1", "websockets>=14",
            "silero-vad>=6", "onnxruntime>=1.20"]
legacy-comparison = ["faiss-cpu>=1.9", "sentence-transformers>=3"]
local = ["llama-cpp-python>=0.3", "huggingface-hub>=0.25"]
embeddings = ["openai>=1.50"]
otel = ["opentelemetry-exporter-otlp>=1.26"]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyright>=1.1.400",
  "pytest-timeout>=2.3",
  "matplotlib>=3.11",
  "websocket-client>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pyright]
venvPath = "."
venv = ".venv"
