name: Keep Render Service Alive

on:
  schedule:
    # Runs every 10 minutes (UTC) to prevent Render free tier from sleeping (15 min limit)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Request
        env:
          # You can either set RENDER_APP_URL in GitHub Repo Settings -> Secrets/Variables -> Actions
          # or directly replace the fallback URL below.
          APP_URL: ${{ vars.RENDER_APP_URL || secrets.RENDER_APP_URL || 'https://clozflow.onrender.com' }}
        run: |
          TARGET_URL="${APP_URL%/}/"
          echo "Pinging: $TARGET_URL"
          
          MAX_RETRIES=4
          DELAY=15
          SUCCESS=false
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 20 "$TARGET_URL" || echo "FAILED")
            echo "HTTP Status: $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "✅ Keep-alive ping successful (Status: $HTTP_STATUS)!"
              SUCCESS=true
              break
            else
              echo "⏳ Render is still waking up / allocating resources (Status: $HTTP_STATUS). Retrying in ${DELAY}s..."
              sleep $DELAY
            fi
          done
          
          if [ "$SUCCESS" = true ]; then
            exit 0
          else
            echo "⚠️ Service did not return 2xx within retry limit, but wake-up request was delivered."
            exit 0
          fi
