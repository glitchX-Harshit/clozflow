name: Integrated development checks

on:
  push:
    branches: [codex/clozflow-brain-integrated]
  pull_request:
    paths:
      - 'brain/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/integrated-development.yml'

permissions:
  contents: read

jobs:
  brain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts
      - run: python -m pyright src
      - run: python -m pytest tests -q --timeout=30
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_AUTH_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
