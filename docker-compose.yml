services:
  clozflow:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    # web/.env (copy .env.example). The backend has always loaded web/.env;
    # backend/.env never existed, so compose failed to start.
    env_file:
      - .env
