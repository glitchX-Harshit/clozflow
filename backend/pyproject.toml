[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clozflow-backend"
version = "0.1.0"
description = "ClozFlow Autonomous Sales Intelligence Backend API & Real-Time Telemetry Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ClozFlow Team" }
]
keywords = ["sales-ai", "fastapi", "websockets", "vad", "deepgram", "gemini", "clozflow"]

dependencies = [
    # Core Web Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0,<14.0",
    "starlette>=0.36.0",
    "python-multipart>=0.0.9",

    # Config & Auth
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.8.0",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "psycopg2-binary>=2.9.9",

    # HTTP Client
    "httpx>=0.27.0",
    "requests>=2.31.0",

    # AI & LLM Providers
    "openai>=1.12.0",
    "google-genai>=0.1.0",

    # ML Pipeline
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.2",
    "pandas>=2.2.0",
    "numpy>=1.24.0",
    "scipy>=1.12.0",

    # Acoustic VAD (Voice Activity Detection)
    "silero-vad>=5.1",
    "onnxruntime>=1.17.0",

    # RAG & Embeddings
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.5.0",

    # PDF & Asset Generation
    "reportlab>=4.1.0",

    # Utilities
    "PyYAML>=6.0.1",
    "phonenumbers>=8.13.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
